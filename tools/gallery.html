// a small drawn avatar so photo templates are exercised
const cvs=document.createElement('canvas');cvs.width=cvs.height=200;
const x=cvs.getContext('2d');x.fillStyle='#c7d2fe';x.fillRect(0,0,200,200);

document.querySelectorAll('iframe[data-id]').forEach(f=>{
  f.srcdoc = renderCV(sample, f.dataset.id, I18N.ar);
